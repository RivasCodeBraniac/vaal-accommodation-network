<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply | Vaal Accommodation Network</title>

    <meta name="description" content="Apply for student accommodation with Vaal Accommodation Network for 2027.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #12345b;
        }

        header {
            background: #12345b;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            color: #f1f1f1;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            margin-bottom: 10px;
            color: #12345b;
        }

        .intro {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #12345b;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #12345b;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #a87800;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8f6700;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #12345b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #12345b;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 40px;
            padding: 25px;
            text-align: center;
            background: #12345b;
            color: white;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-box {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>VAAL ACCOMMODATION NETWORK</h1>
    <p>Student Accommodation for 2027</p>
</header>


<div class="container">

    <div class="form-box">

        <h2>Accommodation Application</h2>

        <p class="intro">
            Complete the form below to apply for student accommodation for 2027.
            Please make sure that all information is correct.
        </p>


        <form id="applicationForm">

            <!-- Initials and Surname -->
            <div class="form-group">
                <label for="name">Initials and Surname</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your initials and surname"
                    required
                >
            </div>


            <!-- WhatsApp Number -->
            <div class="form-group">
                <label for="whatsapp">WhatsApp Phone Number</label>

                <input
                    type="tel"
                    id="whatsapp"
                    name="whatsapp"
                    placeholder="e.g. 0712345678"
                    required
                >
            </div>


            <!-- Accommodation -->
            <div class="form-group">
                <label for="accommodation">Accommodation Option</label>

                <select
                    id="accommodation"
                    name="accommodation"
                    required
                >
                    <option value="">Select accommodation</option>
                    <option value="BW-01">BW-01</option>
                    <option value="SW-01">SW-01</option>
                    <option value="SW-02">SW-02</option>
                </select>
            </div>


            <!-- Funding -->
            <div class="form-group">
                <label for="funding">Funding Type</label>

                <select
                    id="funding"
                    name="funding"
                    required
                >
                    <option value="">Select funding type</option>
                    <option value="NSFAS">NSFAS</option>
                    <option value="Private Bursary">Private Bursary</option>
                    <option value="Self-Funded">Self-Funded</option>
                </select>
            </div>


            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>

                <select
                    id="gender"
                    name="gender"
                    required
                >
                    <option value="">Select gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>


            <!-- Year of Study -->
            <div class="form-group">
                <label for="year">Year of Study in 2027</label>

                <select
                    id="year"
                    name="year"
                    required
                >
                    <option value="">Select year of study</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="5th Year">5th Year</option>
                    <option value="Postgraduate">Postgraduate</option>
                </select>
            </div>


            <button type="submit">
                SUBMIT APPLICATION
            </button>

            <p id="status"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Accommodation
        </a>

    </div>

</div>


<footer>
    © 2026 VaalAccommodationNetwork. All Rights Reserved.
</footer>


<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbzJDgSz1PpeiP3tE6jLrNuMvdz8gQi0KNe_DQmjkuyWv9o_K1EB5SmnKl0M38q_IZg4/exec";

const form = document.getElementById("applicationForm");
const status = document.getElementById("status");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    status.textContent = "Submitting application...";

    const formData = new FormData(form);

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(formData)
    })

    .then(function() {

        status.textContent = "Application submitted successfully.";

        form.reset();

    })

    .catch(function() {

        status.textContent =
            "There was a problem submitting your application.";

    });

});

</script>

</body>
</html>
