<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply | Vaal Accommodation Network</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #12345b;
        }

        .header {
            background: #12345b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            color: #e0b84f;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .intro {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #12345b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #a87800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8f6800;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #12345b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>VAAL ACCOMMODATION NETWORK</h1>
        <p>Student Accommodation for 2027</p>
    </div>

    <div class="container">

        <div class="form-box">

            <h2>Accommodation Application</h2>

            <p class="intro">
                Complete the form below to apply for student accommodation.
            </p>

            <form id="applicationForm">

                <label for="name">Initials and Surname</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your initials and surname"
                    required
                >

                <label for="whatsapp">WhatsApp Phone Number</label>
                <input
                    type="tel"
                    id="whatsapp"
                    name="whatsapp"
                    placeholder="e.g. 0712345678"
                    required
                >

                <label for="accommodation">Accommodation Option</label>
                <select
                    id="accommodation"
                    name="accommodation"
                    required
                >
                    <option value="">Select accommodation</option>
                    <option value="BW-01">BW-01</option>
                    <option value="SW-01">SW-01</option>
                    <option value="SW-02">SW-02</option>
                </select>

                <label for="funding">Funding Type</label>
                <select
                    id="funding"
                    name="funding"
                    required
                >
                    <option value="">Select funding type</option>
                    <option value="NSFAS">NSFAS</option>
                    <option value="Private Bursary">Private Bursary</option>
                    <option value="Self-Funded">Self-Funded</option>
                </select>

                <label for="gender">Gender</label>
                <select
                    id="gender"
                    name="gender"
                    required
                >
                    <option value="">Select gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>

                <label for="year">Year of Study in 2027</label>
                <select
                    id="year"
                    name="year"
                    required
                >
                    <option value="">Select year of study</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="5th Year">5th Year</option>
                    <option value="Postgraduate">Postgraduate</option>
                </select>

                <button type="submit">
                    SUBMIT APPLICATION
                </button>

            </form>

            <p id="status"></p>

        </div>

        <div class="back">
            <a href="index.html">← Back to Accommodation</a>
        </div>

    </div>

    <script>

        const scriptURL = "https://script.google.com/macros/s/AKfycbxHFNCmW6higbBhUCYCaTh6-aE6QKouaOkjlej94btcdfrFrC53uHrm_nMyT6x82QR/exec";

        const form = document.getElementById("applicationForm");
        const status = document.getElementById("status");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            status.textContent = "Submitting application...";

            const formData = new FormData(form);

            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                body: new URLSearchParams(formData)
            })
            .then(function() {

                status.textContent = "Application submitted successfully.";

                form.reset();

            })
            .catch(function() {

                status.textContent =
                    "There was a problem submitting your application.";

            });

        });

    </script>

</body>
</html>
